[package]
name = "rupora"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.92"
description = "A native Rust Markdown editor"
authors = ["qinyin233", "RUPORA contributors"]
license = "MIT"
repository = "https://github.com/qinyin233/rupora"
keywords = ["markdown", "editor", "egui", "rust"]
categories = ["text-editors"]

[package.metadata.packager]
before-packaging-command = "cargo build --release --locked"
product-name = "RUPORA"
identifier = "com.rupora.app"
icons = [
    "src-tauri/icons/32x32.png",
    "src-tauri/icons/128x128.png",
    "src-tauri/icons/128x128@2x.png",
    "src-tauri/icons/icon.icns",
    "src-tauri/icons/icon.ico",
]
license-file = "LICENSE"
category = "Productivity"
file-associations = [
    { extensions = ["md", "markdown", "mdown", "mkd"], mime-type = "text/markdown", description = "Markdown document", name = "Markdown Document", role = "editor" },
    { extensions = ["txt"], mime-type = "text/plain", description = "Plain text document", name = "Text Document", role = "editor" },
]

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "rupora"
path = "native/src/main.rs"

[[bench]]
name = "editor_core"
harness = false

[dependencies]
ammonia = "4.1.4"
arboard = "3.6.1"
chardetng = "0.1.17"
diffy = "0.5.1"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_commonmark = { version = "0.24.0", features = [
    "better_syntax_highlighting",
    "svg",
] }
encoding_rs = "0.8.35"
fs2 = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }
mermaid-svg = "0.7.0"
open = "5.4.0"
pathdiff = "0.2.3"
printpdf = { version = "0.12.5", default-features = false, features = ["html", "svg"] }
pulldown-cmark = "0.13.4"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
rfd = "0.17.2"
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
