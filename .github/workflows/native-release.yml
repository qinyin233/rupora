name: Native release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build platform package
        run: cargo packager --release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupora-${{ matrix.artifact }}
          path: |
            target/release/*-setup.exe
            target/release/*.msi
            target/release/*.dmg
            target/release/*.deb
            target/release/*.AppImage
          if-no-files-found: error

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/*-setup.exe
            target/release/*.msi
            target/release/*.dmg
            target/release/*.deb
            target/release/*.AppImage
