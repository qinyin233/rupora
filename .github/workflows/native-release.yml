name: Native release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      RUPORA_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            artifact: macos-x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            artifact: macos-aarch64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install release tooling
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Verify native target and update signing configuration
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $hostTriple = ((rustc -vV | Select-String "^host:").Line -split ":", 2)[1].Trim()
          if ($hostTriple -ne "${{ matrix.target }}") {
            throw "Runner host $hostTriple does not match release target ${{ matrix.target }}"
          }
          if (-not $env:UPDATE_SIGNING_KEY -or -not $env:RUPORA_UPDATE_PUBLIC_KEY) {
            throw "UPDATE_SIGNING_KEY_BASE64 secret and UPDATE_PUBLIC_KEY_BASE64 variable are required"
          }

      - name: Build platform package
        if: runner.os != 'macOS'
        run: cargo packager --release

      - name: Build signed and notarized macOS package
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release

      - name: Build attested macOS package without Apple signing
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE != 'true'
        run: |
          echo "::warning::Apple signing secrets are not configured; producing an unsigned developer package"
          cargo packager --release

      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "rupora-signing.pfx"
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          Get-ChildItem target/release -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            }

      - name: Report unsigned Windows developer package
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE != 'true'
        run: echo "::warning::Windows signing secrets are not configured; producing an unsigned developer package"

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json

      - name: Stage architecture-specific packages and SBOM
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          $staging = "target/release-artifacts"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $extensions = ".exe", ".msi", ".dmg", ".deb", ".AppImage"
          $packages = Get-ChildItem target/release -File |
            Where-Object { $_.Extension -in $extensions }
          if (-not $packages) { throw "No release packages were produced" }
          $packages | ForEach-Object {
            $stagedName = "$($_.BaseName)-$env:ARTIFACT_NAME$($_.Extension)"
            Copy-Item $_.FullName (Join-Path $staging $stagedName)
          }

          $sbom = Get-Item "rupora.cdx.json" -ErrorAction SilentlyContinue
          if (-not $sbom) { $sbom = Get-Item "bom.json" -ErrorAction SilentlyContinue }
          if (-not $sbom) { throw "CycloneDX SBOM was not produced" }
          Copy-Item $sbom.FullName (Join-Path $staging "rupora-$env:ARTIFACT_NAME.cdx.json")

      - name: Generate signed architecture update manifest
        shell: pwsh
        env:
          RUPORA_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $manifest = "target/release-artifacts/rupora-update-${{ matrix.target }}.json"
          cargo run --release --locked --example release_manifest -- `
            "${{ github.ref_name }}" `
            "${{ matrix.target }}" `
            "target/release-artifacts" `
            $manifest

      - name: Generate SHA-256 checksums
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          $staging = "target/release-artifacts"
          $checksumPath = Join-Path $staging "SHA256SUMS-$env:ARTIFACT_NAME.txt"
          $checksumLines = Get-ChildItem $staging -File |
            Where-Object { $_.Name -ne (Split-Path $checksumPath -Leaf) } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            }
          [IO.File]::WriteAllLines(
            $checksumPath,
            $checksumLines,
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rupora-${{ matrix.artifact }}
          path: target/release-artifacts/*
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: target/release-artifacts/*

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: target/release-artifacts/*
